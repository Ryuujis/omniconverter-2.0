<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090b">
  <title>Giriş Yap — Misacon Studio</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem('misacon_theme') === 'cream') {
          document.documentElement.setAttribute('data-theme', 'cream');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2309090b'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ff5a36' stroke-width='2.4'/%3E%3Ccircle cx='22.5' cy='9.5' r='2.6' fill='%23f1ebe0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 18, 23, 0.75);
      border: 1px solid var(--line-2);
      border-radius: var(--r-lg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.04);
      padding: 40px 32px;
      animation: cardAppear 0.4s var(--ease);
    }
    [data-theme="cream"] .login-card {
      background: rgba(255, 252, 246, 0.88);
      box-shadow: 0 24px 64px -12px rgba(45, 36, 22, 0.16), 0 0 0 1px rgba(31, 28, 24, 0.06);
    }
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 90, 54, 0.08);
      border: 1px solid rgba(255, 90, 54, 0.2);
      margin-bottom: 20px;
      box-shadow: 0 0 32px -4px var(--accent-glow);
    }
    .login-logo svg {
      width: 36px;
      height: 36px;
    }
    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .input-ico {
      position: absolute;
      left: 14px;
      color: var(--muted);
      width: 18px;
      height: 18px;
      pointer-events: none;
      transition: color 0.2s var(--ease);
    }
    .login-input {
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      padding: 0 16px 0 44px;
      color: var(--ink);
      font-size: 15px;
      outline: none;
      transition: all 0.2s var(--ease);
    }
    .login-input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .input-wrap:focus-within .input-ico {
      color: var(--accent);
    }
    .login-btn {
      margin-top: 8px;
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-lo) 100%);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: var(--r-sm);
      box-shadow: 0 8px 24px -4px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s var(--ease);
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -2px var(--accent-glow);
      filter: brightness(1.08);
    }
    .login-btn:active {
      transform: translateY(0);
      filter: brightness(0.96);
    }
    .alert-error {
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.28);
      color: #ff9494;
      border-radius: var(--r-sm);
      padding: 12px 14px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      animation: alertShake 0.3s var(--ease);
    }
    @keyframes alertShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--faint);
    }
  </style>
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="ambient__glow ambient__glow--a"></div>
  <div class="ambient__glow ambient__glow--b"></div>
  <div class="ambient__grid"></div>
  <div class="ambient__grain"></div>
</div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" class="brand__ring"/><circle cx="20" cy="20" r="16.5" class="brand__orbit"/><circle cx="31.7" cy="8.3" r="3" class="brand__moon"/></svg>
      </div>
      <h1 class="login-title">Misacon Studio</h1>
      <p class="login-subtitle">Devam etmek için lütfen giriş yapın</p>
    </div>

    {% if error %}
    <div class="alert-error" role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="login-form" method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Kullanıcı Adı</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" name="username" class="login-input" placeholder="Kullanıcı adınız" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Şifre</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" class="login-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="login-btn">
        <span>Giriş Yap</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="login-footer">
      Misacon Studio &copy; 2026 &middot; Güvenli Yerel Panel
    </div>
  </div>
</div>

</body>
</html>
